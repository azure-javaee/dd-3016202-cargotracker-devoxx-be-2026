receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

processors:
  transform/sanitize:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - delete_key(attributes, "url.query")
          - delete_key(attributes, "url.full")
          - delete_key(attributes, "http.url")
          - delete_key(attributes, "http.target")
          - delete_key(attributes, "db.statement")
          - delete_key(attributes, "db.connection_string")
          - delete_key(attributes, "db.user")
          - delete_key(attributes, "http.request.body")
          - delete_key(attributes, "http.response.body")
          - delete_key(attributes, "http.request.header.authorization")
          - delete_key(attributes, "http.request.header.cookie")
          - delete_key(attributes, "http.response.header.set_cookie")
    metric_statements:
      - context: datapoint
        statements:
          - delete_key(attributes, "url.query")
          - delete_key(attributes, "url.full")
          - delete_key(attributes, "http.url")
          - delete_key(attributes, "http.target")
          - delete_key(attributes, "db.statement")
          - delete_key(attributes, "db.connection_string")
          - delete_key(attributes, "db.user")
          - delete_key(attributes, "http.request.body")
          - delete_key(attributes, "http.response.body")
          - delete_key(attributes, "http.request.header.authorization")
          - delete_key(attributes, "http.request.header.cookie")
          - delete_key(attributes, "http.response.header.set_cookie")
  batch:

exporters:
  file/traces:
    path: /otel-output/traces.json
    format: json
  file/metrics:
    path: /otel-output/metrics.json
    format: json

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [transform/sanitize, batch]
      exporters: [file/traces]
    metrics:
      receivers: [otlp]
      processors: [transform/sanitize, batch]
      exporters: [file/metrics]

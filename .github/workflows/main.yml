name: Main Build

on:
  push:
    branches:
      - edburns/dd-3016202-cargotracker-devoxx-be-2026-01
      - edburns/dd-3016202-cargotracker-devoxx-be-2026-experiment
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  formatting:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: "17"
      - name: Cache Maven packages
        uses: actions/cache@v6
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Check formatting
        run: ./mvnw spotless:check

  source-gates:
    runs-on: ubuntu-latest
    needs: [formatting]
    defaults:
      run:
        working-directory: demo
    env:
      CI_PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: "17"
      - name: Cache Maven packages
        uses: actions/cache@v6
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Run formatting, compiler, and SpotBugs gates
        run: ./scripts/ci/verify-source-gates.sh
      - name: Upload source gates
        id: upload-source-gates
        uses: actions/upload-artifact@v4
        with:
          name: source-gates
          path: demo/ci-artifacts/source-gates
          retention-days: 90
          if-no-files-found: error
      - name: Record source-gate evidence
        if: always()
        run: |
          {
            echo "### Source-gate evidence"
            echo "- Tested SHA: \`${GITHUB_SHA}\`"
            echo "- source-gates: id \`${{ steps.upload-source-gates.outputs.artifact-id }}\`, URL ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts/${{ steps.upload-source-gates.outputs.artifact-id }}, digest \`${{ steps.upload-source-gates.outputs.artifact-digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    runs-on: ubuntu-latest
    needs: [formatting, source-gates]
    defaults:
      run:
        working-directory: demo
    env:
      CI_EVENT: ${{ github.event_name }}
      CI_PR_NUMBER: ${{ github.event.pull_request.number }}
      CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      CI_FALLBACK_BASE_REF: origin/${{ github.event.repository.default_branch }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: "17"
      - name: Cache Maven packages
        uses: actions/cache@v6
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Capture evidence start
        run: |
          echo "CI_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          {
            echo 'CI_COMMANDS<<EOF'
            echo 'echo "CI_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"'
            echo "./mvnw '-P!openliberty' -DskipTests clean compile"
            echo "./scripts/ci/run-dependency-security-gate.sh"
            echo "./mvnw '-P!openliberty' -Dtest=CargoTest,ItineraryTest,RouteSpecificationTest,HandlingEventTest,HandlingHistoryTest,LayeringTest,BookingFacadeDtoTest clean test"
            echo "./mvnw -Popenliberty -Dtest=BookingServiceTest clean test"
            echo 'PACKAGE_LOG="ci-artifacts/build-contract/$(date +%Y%m%d-%H%M)-job-logs.txt"; mkdir -p "$(dirname "$PACKAGE_LOG")"; ./mvnw -Popenliberty -DskipTests clean package 2>&1 | tee "$PACKAGE_LOG"'
            echo "./scripts/ci/verify-compatibility-contract.sh"
            echo "./scripts/ci/run-observability-check.sh"
            echo "./scripts/ci/run-observability-negative-controls.sh"
            echo "./scripts/ci/run-negative-controls.sh"
            echo "./scripts/ci/run-safety-net-negative-controls.sh"
            echo "./scripts/ci/write-build-metadata.sh"
            echo 'echo "CI_ENDED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"'
            echo "./scripts/ci/write-build-metadata.sh --artifact-metadata"
            echo "./scripts/ci/verify-build-contract.sh"
            echo EOF
          } >> "$GITHUB_ENV"
      - name: Compile without Open Liberty
        run: ./mvnw '-P!openliberty' -DskipTests clean compile
      - name: Run dependency security and delta gate
        timeout-minutes: 15
        run: ./scripts/ci/run-dependency-security-gate.sh
      - name: Run focused unit tests
        run: >
          ./mvnw '-P!openliberty'
          -Dtest=CargoTest,ItineraryTest,RouteSpecificationTest,HandlingEventTest,HandlingHistoryTest,LayeringTest,BookingFacadeDtoTest
          clean test
      - name: Write test inventory
        run: ./scripts/ci/write-test-inventory.sh
      - name: Preserve unit test reports
        run: cp -R target/surefire-reports ci-artifacts/test-reports-unit/surefire-reports
      - name: Assert unit test count
        run: |
          count=$(grep -h '<testsuite ' target/surefire-reports/TEST-*.xml | sed -E 's/.*tests="([0-9]+)".*/\1/' | awk '{ total += $1 } END { print total + 0 }')
          skipped=$(grep -ho 'skipped="[0-9]*"' target/surefire-reports/TEST-*.xml | cut -d'"' -f2 | awk '{ total += $1 } END { print total + 0 }')
          test "$count" -eq 27
          test "$skipped" -eq 0
      - name: Run Open Liberty integration tests
        run: ./mvnw -Popenliberty -Dtest=BookingServiceTest clean test
      # clean intentionally removes the unit reports before the separate integration count.
      - name: Assert Arquillian test count
        run: |
          report=target/surefire-reports/TEST-org.eclipse.cargotracker.application.BookingServiceTest.xml
          test -f "$report"
          count=$(sed -nE 's/.*tests="([0-9]+)".*/\1/p' "$report" | head -n 1)
          failures=$(sed -nE 's/.*failures="([0-9]+)".*/\1/p' "$report" | head -n 1)
          errors=$(sed -nE 's/.*errors="([0-9]+)".*/\1/p' "$report" | head -n 1)
          skipped=$(sed -nE 's/.*skipped="([0-9]+)".*/\1/p' "$report" | head -n 1)
          test "$count" -ge 4
          test "$failures" -eq 0
          test "$errors" -eq 0
          test "$skipped" -eq 0
          for method in \
            testRegisterNew \
            testRouteCandidates \
            testAssignRoute \
            testChangeDestination; do
            grep -Fq "name=\"$method\"" "$report"
          done
      - name: Preserve Liberty test reports
        run: mkdir -p ci-artifacts/test-reports-liberty && cp -R target/surefire-reports ci-artifacts/test-reports-liberty/surefire-reports
      - name: Build canonical WAR
        run: |
          PACKAGE_LOG="ci-artifacts/build-contract/$(date +%Y%m%d-%H%M)-job-logs.txt"
          mkdir -p "$(dirname "$PACKAGE_LOG")"
          ./mvnw -Popenliberty -DskipTests clean package 2>&1 | tee "$PACKAGE_LOG"
      - name: Verify Java 17 and Java EE 7 contract
        run: ./scripts/ci/verify-compatibility-contract.sh
      - name: Run OpenTelemetry observability acceptance
        timeout-minutes: 10
        run: ./scripts/ci/run-observability-check.sh
      - name: Run observability negative controls
        run: ./scripts/ci/run-observability-negative-controls.sh
      - name: Run negative controls
        run: |
          ./scripts/ci/run-negative-controls.sh
          ./scripts/ci/run-safety-net-negative-controls.sh
      - name: Verify performance launcher rejects user tuning
        run: ./performance/run-negative-controls.sh
      - name: Run bounded Java and jaz performance comparison
        id: performance
        timeout-minutes: 70
        run: ./performance/run-workload.sh
      - name: Verify every retained performance JFR
        id: performance-jfr-verification
        if: always() && steps.performance.outcome != 'skipped'
        run: |
          ./performance/collect-process-metadata.sh verify-artifact-jfr \
            "$RUNNER_TEMP/performance-jfr-verification.txt" \
            ci-artifacts/performance-java \
            ci-artifacts/performance-jaz-bypassed \
            ci-artifacts/performance-jaz-tuned
      - name: Verify performance artifact redaction
        id: performance-redaction
        if: always() && steps.performance.outcome != 'skipped'
        run: |
          ./scripts/ci/redact-artifacts.sh --check-only \
            ci-artifacts/performance-java \
            ci-artifacts/performance-jaz-bypassed \
            ci-artifacts/performance-jaz-tuned \
            ci-artifacts/performance-comparison \
            > ci-artifacts/performance-comparison/redaction-check.txt 2>&1
      - name: Write performance artifact metadata
        id: performance-metadata
        if: always() && steps.performance.outcome != 'skipped'
        env:
          CI_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: ./performance/collect-process-metadata.sh summarize write-artifact-metadata
      - name: Verify final performance artifact redaction
        id: performance-final-redaction
        if: always() && steps.performance-metadata.outcome == 'success' && steps.performance-redaction.outcome == 'success' && steps.performance-jfr-verification.outcome == 'success'
        run: |
          ./scripts/ci/redact-artifacts.sh --check-only \
            ci-artifacts/performance-java \
            ci-artifacts/performance-jaz-bypassed \
            ci-artifacts/performance-jaz-tuned \
            ci-artifacts/performance-comparison
      - name: Upload direct Java performance evidence
        id: upload-performance-java
        if: always() && steps.performance-metadata.outcome == 'success' && steps.performance-final-redaction.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: performance-java
          path: demo/ci-artifacts/performance-java
          retention-days: 90
          if-no-files-found: error
      - name: Upload bypassed jaz performance evidence
        id: upload-performance-jaz-bypassed
        if: always() && steps.performance-metadata.outcome == 'success' && steps.performance-final-redaction.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: performance-jaz-bypassed
          path: demo/ci-artifacts/performance-jaz-bypassed
          retention-days: 90
          if-no-files-found: error
      - name: Upload tuned jaz performance evidence
        id: upload-performance-jaz-tuned
        if: always() && steps.performance-metadata.outcome == 'success' && steps.performance-final-redaction.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: performance-jaz-tuned
          path: demo/ci-artifacts/performance-jaz-tuned
          retention-days: 90
          if-no-files-found: error
      - name: Upload performance comparison
        id: upload-performance-comparison
        if: always() && steps.performance-metadata.outcome == 'success' && steps.performance-final-redaction.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: performance-comparison
          path: demo/ci-artifacts/performance-comparison
          retention-days: 90
          if-no-files-found: error
      - name: Record performance artifact evidence
        if: always() && steps.performance-metadata.outcome == 'success'
        run: |
          {
            echo "### JVM performance evidence"
            echo "- Tested SHA: \`${GITHUB_SHA}\`"
            echo "- performance-java: id \`${{ steps.upload-performance-java.outputs.artifact-id }}\`, URL ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts/${{ steps.upload-performance-java.outputs.artifact-id }}, digest \`${{ steps.upload-performance-java.outputs.artifact-digest }}\`"
            echo "- performance-jaz-bypassed: id \`${{ steps.upload-performance-jaz-bypassed.outputs.artifact-id }}\`, URL ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts/${{ steps.upload-performance-jaz-bypassed.outputs.artifact-id }}, digest \`${{ steps.upload-performance-jaz-bypassed.outputs.artifact-digest }}\`"
            echo "- performance-jaz-tuned: id \`${{ steps.upload-performance-jaz-tuned.outputs.artifact-id }}\`, URL ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts/${{ steps.upload-performance-jaz-tuned.outputs.artifact-id }}, digest \`${{ steps.upload-performance-jaz-tuned.outputs.artifact-digest }}\`"
            echo "- performance-comparison: id \`${{ steps.upload-performance-comparison.outputs.artifact-id }}\`, URL ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts/${{ steps.upload-performance-comparison.outputs.artifact-id }}, digest \`${{ steps.upload-performance-comparison.outputs.artifact-digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Write build contract reports
        run: ./scripts/ci/write-build-metadata.sh
      - name: Capture evidence end
        run: echo "CI_ENDED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: Write artifact metadata
        run: ./scripts/ci/write-build-metadata.sh --artifact-metadata
      - name: Write observability artifact metadata
        id: observability-metadata
        if: always()
        run: python3 ./scripts/ci/write-observability-metadata.py
      - name: Verify final observability artifact redaction
        id: final-artifact-redaction
        if: always() && steps.observability-metadata.outcome == 'success'
        run: ./scripts/ci/redact-artifacts.sh --check-only ci-artifacts/otel-telemetry ci-artifacts/liberty-logs
      - name: Verify build contract
        run: ./scripts/ci/verify-build-contract.sh
      - name: Upload unit test reports
        id: upload-test-reports-unit
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-unit
          path: demo/ci-artifacts/test-reports-unit
          retention-days: 90
          if-no-files-found: error
      - name: Upload Liberty test reports
        id: upload-test-reports-liberty
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-liberty
          path: demo/ci-artifacts/test-reports-liberty
          retention-days: 90
          if-no-files-found: error
      - name: Upload Liberty logs
        id: upload-liberty-logs
        if: always() && steps.observability-metadata.outcome == 'success' && steps.final-artifact-redaction.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: liberty-logs
          path: demo/ci-artifacts/liberty-logs
          retention-days: 90
          if-no-files-found: error
      - name: Upload OpenTelemetry telemetry
        id: upload-otel-telemetry
        if: always() && steps.observability-metadata.outcome == 'success' && steps.final-artifact-redaction.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: otel-telemetry
          path: demo/ci-artifacts/otel-telemetry
          retention-days: 90
          if-no-files-found: error
      - name: Upload build contract
        id: upload-build-contract
        uses: actions/upload-artifact@v4
        with:
          name: build-contract
          path: demo/ci-artifacts/build-contract
          retention-days: 90
          if-no-files-found: error
      - name: Upload dependency reports
        id: upload-dependency-reports
        uses: actions/upload-artifact@v4
        with:
          name: dependency-reports
          path: demo/ci-artifacts/dependency-reports
          retention-days: 90
          if-no-files-found: error
      - name: Upload compatibility contract
        id: upload-compatibility-contract
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-contract
          path: demo/ci-artifacts/compatibility-contract
          retention-days: 90
          if-no-files-found: error
      - name: Record artifact evidence
        if: always()
        run: |
          {
            echo "### Build contract evidence"
            echo "- Tested SHA: \`${GITHUB_SHA}\`"
            echo "- build-contract: id \`${{ steps.upload-build-contract.outputs.artifact-id }}\`, URL ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts/${{ steps.upload-build-contract.outputs.artifact-id }}, digest \`${{ steps.upload-build-contract.outputs.artifact-digest }}\`"
            echo "- dependency-reports: id \`${{ steps.upload-dependency-reports.outputs.artifact-id }}\`, URL ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts/${{ steps.upload-dependency-reports.outputs.artifact-id }}, digest \`${{ steps.upload-dependency-reports.outputs.artifact-digest }}\`"
            echo "- compatibility-contract: id \`${{ steps.upload-compatibility-contract.outputs.artifact-id }}\`, URL ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts/${{ steps.upload-compatibility-contract.outputs.artifact-id }}, digest \`${{ steps.upload-compatibility-contract.outputs.artifact-digest }}\`"
            echo "- test-reports-unit: id \`${{ steps.upload-test-reports-unit.outputs.artifact-id }}\`, URL ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts/${{ steps.upload-test-reports-unit.outputs.artifact-id }}, digest \`${{ steps.upload-test-reports-unit.outputs.artifact-digest }}\`"
            echo "- test-reports-liberty: id \`${{ steps.upload-test-reports-liberty.outputs.artifact-id }}\`, URL ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts/${{ steps.upload-test-reports-liberty.outputs.artifact-id }}, digest \`${{ steps.upload-test-reports-liberty.outputs.artifact-digest }}\`"
            echo "- liberty-logs: id \`${{ steps.upload-liberty-logs.outputs.artifact-id }}\`, URL ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts/${{ steps.upload-liberty-logs.outputs.artifact-id }}, digest \`${{ steps.upload-liberty-logs.outputs.artifact-digest }}\`"
            echo "- otel-telemetry: id \`${{ steps.upload-otel-telemetry.outputs.artifact-id }}\`, URL ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts/${{ steps.upload-otel-telemetry.outputs.artifact-id }}, digest \`${{ steps.upload-otel-telemetry.outputs.artifact-digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
